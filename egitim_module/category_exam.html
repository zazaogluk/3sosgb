<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori Sınavı - 3S OSGB</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
<div class="container">
    <div class="logo-area">
        <img src="3S OSGB.jpg" alt="Logo" class="logo">
        <h2>Kategori Sınavı</h2>
    </div>
    <h3 id="categoryName"></h3>
    <div id="quizArea"></div>
    <button id="submitBtn">Sınavı Bitir</button>
    <div id="result"></div>
    <button id="backBtn" style="margin-top:20px;">Eğitim Listesine Dön</button>
</div>
<script>
    if (!checkSessionAndRedirect()) {
        // yönlendirildi
    } else {
        startIdleMonitoring();
        
        const urlParams = new URLSearchParams(window.location.search);
        const category = decodeURIComponent(urlParams.get('cat'));
        const userId = parseInt(localStorage.getItem('activeUserId'));
        if (!category || !userId) window.location.href = 'user_dashboard.html';
        document.getElementById('categoryName').innerText = category;

        const exam = categoryExams[category];
        if (!exam || !exam.questions || exam.questions.length === 0) {
            document.getElementById('quizArea').innerHTML = '<p>Sınav soruları henüz tanımlanmamış.</p>';
        } else {
            const questions = exam.questions;
            let userAnswers = new Array(questions.length).fill(null);
            const container = document.getElementById('quizArea');
            questions.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'quiz-question';
                div.innerHTML = `<strong>${idx+1}. ${q.text}</strong><br>`;
                q.options.forEach((opt, optIdx) => {
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q${idx}`;
                    radio.value = optIdx;
                    radio.onclick = () => { userAnswers[idx] = optIdx; };
                    const label = document.createElement('label');
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(opt));
                    div.appendChild(label);
                    div.appendChild(document.createElement('br'));
                });
                container.appendChild(div);
            });
            document.getElementById('submitBtn').onclick = () => {
                if (userAnswers.includes(null)) { alert("Tüm soruları cevaplayın."); return; }
                let correct = 0;
                questions.forEach((q,i) => { if(userAnswers[i]===q.correct) correct++; });
                const score = (correct/questions.length)*100;
                const passed = score >= 60;
                setCategoryExamResult(userId, category, score, passed);
                const resultDiv = document.getElementById('result');
                if(passed) {
                    resultDiv.innerHTML = `<span style="color:green;">✅ Başarılı! Puan: ${score.toFixed(1)}. Kategori tamamlandı.</span>`;
                    document.getElementById('submitBtn').disabled = true;
                } else {
                    resultDiv.innerHTML = `<span style="color:red;">❌ Başarısız! Puan: ${score.toFixed(1)}. Tekrar deneyin.</span>`;
                }
            };
        }
        document.getElementById('backBtn').onclick = () => { window.location.href = 'user_dashboard.html'; };
    }
</script>
</body>
</html>
