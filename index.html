<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3S OSGB | İş Sağlığı ve Güvenliği</title>
<meta name="description" content="3S OSGB - İş Sağlığı ve Güvenliği hizmetleri.">

<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f4f6f8;
  color:#333;
  scroll-behavior:smooth;
}

/* NAVBAR */
.navbar{
  position:fixed;
  top:0;
  width:100%;
  padding:18px 60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:0.4s ease;
  z-index:1000;
}

.navbar.scrolled{
  background:rgba(0,40,80,0.95);
  backdrop-filter:blur(10px);
}

.small-logo{
  height:40px;
  opacity:0;
  transition:0.4s ease;
}

.navbar.scrolled .small-logo{
  opacity:1;
}

/* NAV LINKS */
.nav-links{
  display:flex;
  align-items:center;
}

.nav-links ul{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  align-items:center;
}

.nav-links li{
  position:relative;
}

.nav-links a{
  text-decoration:none;
  margin-left:30px;
  color:white; /* DÜZELTİLDİ */
  font-weight:500;
  transition:0.3s;
  display:block;
}

.nav-links a:hover{
  opacity:0.8;
}

/* DROPDOWN */
.dropdown-menu{
  position:absolute;
  top:40px;
  left:0;
  background:#002850;
  display:none;
  flex-direction:column;
  min-width:220px;
  border-radius:10px;
  overflow:hidden;
}

.dropdown-menu a{
  margin:0;
  padding:12px 20px;
  color:white;
}

.dropdown-menu a:hover{
  background:#001f3d;
}

.dropdown:hover .dropdown-menu{
  display:flex;
}

/* MOBILE */
.menu-toggle{
  display:none;
  font-size:28px;
  color:white;
  cursor:pointer;
}

@media(max-width:768px){

  .navbar{padding:15px 20px;}

  .nav-links{
    position:absolute;
    top:70px;
    left:0;
    width:100%;
    background:#002850;
    max-height:0;
    overflow:hidden;
    transition:max-height 0.3s ease;
  }

  .nav-links.active{
    max-height:800px;
  }

  .nav-links ul{
    flex-direction:column;
  }

  .nav-links a{
    margin:15px 0;
  }

  .dropdown-menu{
    position:static;
    display:flex;
    background:#001f3d;
  }

  .menu-toggle{
    display:block;
  }
}

/* HERO */
header{
  height:100vh;
  background:linear-gradient(135deg,#002850,#003f7d);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:0 20px;
}

.hero-content{
  background:rgba(255,255,255,0.08);
  padding:60px;
  border-radius:25px;
  backdrop-filter:blur(12px);
  animation:fadeIn 1.5s ease forwards;
  opacity:0;
}

@keyframes fadeIn{
  to{opacity:1;}
}

.hero-logo img{
  width:260px;
  max-width:85%;
  margin-bottom:25px;
  filter:drop-shadow(0 0 20px rgba(255,255,255,0.25));
}

.tagline{
  font-weight:100;
  font-style:italic;
  font-size:1.4em;
  margin-bottom:40px;
  color:white;
}
</style>
</head>

<body>

<div class="navbar" id="navbar">
<img class="small-logo" src="https://raw.githubusercontent.com/zazaogluk/3sosgb/main/Logo.png?v=8">

<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<div class="nav-links" id="navLinks">
<ul>
  <li><a href="#">Anasayfa</a></li>
  <li><a href="#">Kurumsal</a></li>

  <li class="dropdown">
    <a href="#">Hizmetlerimiz</a>
    <div class="dropdown-menu">
      <a href="#">OSGB Hizmetleri</a>
      <a href="#">Mobil Sağlık Hizmetleri</a>
      <a href="#">Eğitim Hizmetleri</a>
    </div>
  </li>

  <li><a href="#">İletişim</a></li>
</ul>
</div>
</div>

<header>
<div class="hero-content">
<div class="hero-logo">
<img src="https://raw.githubusercontent.com/zazaogluk/3sosgb/main/Logo.png?v=8">
</div>
<div class="tagline">Sağlık, Sorumluluk, Süreklilik...</div>
</div>
</header>

<script>
function toggleMenu(){
  document.getElementById("navLinks").classList.toggle("active");
}

window.addEventListener("scroll",function(){
  const navbar=document.getElementById("navbar");
  if(window.scrollY>50){
    navbar.classList.add("scrolled");
  }else{
    navbar.classList.remove("scrolled");
  }
});
</script>

</body>
</html>
