<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3S OSGB | İş Sağlığı ve Güvenliği</title>
<meta name="description" content="3S OSGB - İş Sağlığı ve Güvenliği hizmetleri.">

<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f4f6f8;
  color:#333;
  scroll-behavior:smooth;
  overflow-x:hidden;
}

/* NAVBAR */
.navbar{
  position:fixed;
  top:0;
  width:100%;
  padding:18px 60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:0.4s ease;
  z-index:1000;
}

.navbar.scrolled{
  background:rgba(0,40,80,0.95);
  backdrop-filter:blur(10px);
}

.small-logo{
  height:40px;
  opacity:0;
  transition:0.4s ease;
}

.navbar.scrolled .small-logo{
  opacity:1;
}

/* HAMBURGER */
.menu-toggle{
  width:30px;
  height:22px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
  z-index:1100;
}

.menu-toggle span{
  height:3px;
  width:100%;
  background:white;
  border-radius:2px;
  transition:0.4s ease;
}

/* X ANİMASYONU */
.menu-toggle.active span:nth-child(1){
  transform:rotate(45deg) translate(5px,5px);
}

.menu-toggle.active span:nth-child(2){
  opacity:0;
}

.menu-toggle.active span:nth-child(3){
  transform:rotate(-45deg) translate(6px,-6px);
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  opacity:0;
  visibility:hidden;
  transition:0.4s ease;
  z-index:900;
}

.overlay.active{
  opacity:1;
  visibility:visible;
}

/* NAV MENU (SLIDE) */
.nav-links{
  position:fixed;
  top:0;
  right:-320px;
  height:100%;
  width:280px;
  background:#002850;
  padding:100px 30px;
  transition:0.4s ease;
  z-index:1000;
  overflow-y:auto;
}

.nav-links.active{
  right:0;
}

.nav-links ul{
  list-style:none;
  padding:0;
  margin:0;
}

.nav-links li{
  margin-bottom:20px;
}

.nav-links a{
  text-decoration:none;
  color:white;
  font-weight:500;
  display:block;
  transition:0.3s;
}

.nav-links a:hover{
  opacity:0.8;
}

/* DROPDOWN */
.dropdown-menu{
  max-height:0;
  overflow:hidden;
  transition:0.4s ease;
  padding-left:15px;
}

.dropdown.active .dropdown-menu{
  max-height:300px;
  margin-top:10px;
}

.dropdown-menu a{
  font-size:14px;
  margin-bottom:10px;
}

/* HERO */
header{
  height:100vh;
  background:linear-gradient(135deg,#002850,#003f7d);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:0 20px;
}

.hero-content{
  background:rgba(255,255,255,0.08);
  padding:60px;
  border-radius:25px;
  backdrop-filter:blur(12px);
  animation:fadeIn 1.5s ease forwards;
  opacity:0;
}

@keyframes fadeIn{
  to{opacity:1;}
}

.hero-logo img{
  width:260px;
  max-width:85%;
  margin-bottom:25px;
  filter:drop-shadow(0 0 20px rgba(255,255,255,0.25));
}

.tagline{
  font-weight:100;
  font-style:italic;
  font-size:1.4em;
  margin-bottom:40px;
  color:white;
}
</style>
</head>

<body>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="navbar" id="navbar">
<img class="small-logo" src="https://raw.githubusercontent.com/zazaogluk/3sosgb/main/Logo.png?v=8">

<div class="menu-toggle" id="menuToggle" onclick="toggleMenu()">
  <span></span>
  <span></span>
  <span></span>
</div>

<div class="nav-links" id="navLinks">
<ul>
  <li><a href="#" onclick="closeMenu()">Anasayfa</a></li>
  <li><a href="#hakkimizda" onclick="closeMenu()">Kurumsal</a></li>

  <li class="dropdown">
    <a href="javascript:void(0)" onclick="toggleDropdown()">Hizmetlerimiz</a>
    <div class="dropdown-menu">
      <a href="#osgb" onclick="closeMenu()">OSGB Hizmetleri</a>
      <a href="#mobil" onclick="closeMenu()">Mobil Sağlık Hizmetleri</a>
      <a href="#egitim" onclick="closeMenu()">Eğitim Hizmetleri</a>
    </div>
  </li>

  <li><a href="#iletisim" onclick="closeMenu()">İletişim</a></li>
</ul>
</div>
</div>

<header>
<div class="hero-content">
<div class="hero-logo">
<img src="https://raw.githubusercontent.com/zazaogluk/3sosgb/main/Logo.png?v=8">
</div>
<div class="tagline">Sağlık, Sorumluluk, Süreklilik...</div>
</div>
</header>

<script>
const navLinks = document.getElementById("navLinks");
const menuToggle = document.getElementById("menuToggle");
const overlay = document.getElementById("overlay");

function toggleMenu(){
  navLinks.classList.toggle("active");
  menuToggle.classList.toggle("active");
  overlay.classList.toggle("active");
}

function closeMenu(){
  navLinks.classList.remove("active");
  menuToggle.classList.remove("active");
  overlay.classList.remove("active");
  document.querySelector(".dropdown").classList.remove("active");
}

function toggleDropdown(){
  document.querySelector(".dropdown").classList.toggle("active");
}

window.addEventListener("scroll",function(){
  const navbar=document.getElementById("navbar");
  if(window.scrollY>50){
    navbar.classList.add("scrolled");
  }else{
    navbar.classList.remove("scrolled");
  }
});
</script>

</body>
</html>
