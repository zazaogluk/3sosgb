<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Eğitim - 3S OSGB</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <style>
        video::-webkit-media-controls-playback-rate-button { display: none !important; }
        video::-webkit-media-controls-enclosure { overflow: hidden; }
        video::-internal-media-controls-download-button { display: none; }
        video::-webkit-media-controls-fullscreen-button { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-area">
        <img src="3S OSGB.jpg" alt="Logo" class="logo">
        <h2>Modül Eğitimi</h2>
    </div>
    <div id="moduleInfo">
        <h3 id="moduleTitle"></h3>
        <p id="moduleCategory"></p>
    </div>
    <div class="video-wrapper">
        <video id="trainingVideo" width="100%" controls controlslist="nodownload nofullscreen noremoteplayback" disablepictureinpicture>
            <source id="videoSource" src="">
        </video>
    </div>
    <div style="display: flex; gap: 15px; margin-top: 20px;">
        <button id="backToDashboard">Eğitim Listesine Dön</button>
        <button id="nextModuleBtn" style="display:none;">→ Sonraki Eğitime Geç</button>
    </div>
</div>
<script>
    if (!checkSessionAndRedirect()) {
        // yönlendirildi
    } else {
        startIdleMonitoring();
        
        // Sayfa kapatılırken idle timer'ı durdur ve çıkış zamanını güncelle (dashboard'da timer var, orada yapılacak)
        // Bu sayfada timer dashboard'da çalıştığı için ek bir işlem yapmaya gerek yok.
        
        const urlParams = new URLSearchParams(window.location.search);
        const moduleId = urlParams.get('id');
        const userId = parseInt(localStorage.getItem('activeUserId'));
        if (!moduleId || !userId) window.location.href = 'user_dashboard.html';
        const dangerClass = localStorage.getItem('activeDangerClass');
        const userModules = getModulesForDangerClass(dangerClass);
        const moduleData = userModules.find(m => m.id === moduleId);
        if (!moduleData) window.location.href = 'user_dashboard.html';

        document.getElementById('moduleTitle').innerText = moduleData.title;
        document.getElementById('moduleCategory').innerText = moduleData.category;
        const video = document.getElementById('trainingVideo');
        const source = document.getElementById('videoSource');
        source.src = moduleData.videoUrl;
        video.load();

        video.playbackRate = 1;
        video.addEventListener('ratechange', () => { video.playbackRate = 1; });

        let lastTime = 0;
        video.addEventListener('seeking', () => {
            if (video.currentTime > lastTime + 0.5) {
                video.currentTime = lastTime;
                alert("İleri sarma yapılamaz!");
            }
            lastTime = video.currentTime;
        });
        
        video.addEventListener('playing', () => { stopIdleMonitoring(); });
        video.addEventListener('pause', () => { startIdleMonitoring(); });
        video.addEventListener('ended', () => { startIdleMonitoring(); });
        
        video.addEventListener('timeupdate', () => {
            lastTime = video.currentTime;
            const percent = (video.currentTime / video.duration) * 100;
            saveUserProgress(userId, moduleId, { videoWatchedPercent: Math.min(100, Math.floor(percent)) });
        });
        video.addEventListener('ended', () => {
            saveUserProgress(userId, moduleId, { videoWatchedPercent: 100 });
            const catModules = userModules.filter(m => m.category === moduleData.category);
            const currentIndex = catModules.findIndex(m => m.id === moduleId);
            if (currentIndex !== -1 && currentIndex + 1 < catModules.length) {
                const nextMod = catModules[currentIndex+1];
                const nextBtn = document.getElementById('nextModuleBtn');
                nextBtn.style.display = 'inline-block';
                nextBtn.onclick = () => {
                    window.location.href = `module.html?id=${nextMod.id}`;
                };
            } else {
                setTimeout(() => {
                    alert("Bu kategorideki tüm videoları tamamladınız. Sınav için eğitim listesine dönün.");
                }, 500);
            }
        });
        
        document.getElementById('backToDashboard').onclick = () => {
            window.location.href = 'user_dashboard.html';
        };
    }
</script>
</body>
</html>
