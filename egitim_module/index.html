<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3S OSGB - Uzaktan Eğitim Giriş</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container login-container">
    <div class="logo-area">
        <img src="3S OSGB.jpg" alt="3S OSGB" class="logo">
        <h1>3S OSGB Uzaktan Eğitim</h1>
    </div>
    <h2>İSG Uzaktan Eğitim Sistemi</h2>
    <form id="loginForm">
        <input type="text" id="loginUsername" placeholder="Kullanıcı Adı" required>
        <input type="password" id="loginPassword" placeholder="Şifre" required>
        <button type="submit">Giriş Yap</button>
        <div id="loginError" class="error"></div>
    </form>
</div>
<script src="script.js"></script>
<script>
    let users = JSON.parse(localStorage.getItem('users') || '[]');
    const adminExists = users.find(u => u.username === 'admin');
    if (!adminExists) {
        users.push({
            id: Date.now(),
            username: 'admin',
            password: '3Sosgb2026',
            company: '3S OSGB',
            dangerClass: 'tehlikeli',
            role: 'admin'
        });
        localStorage.setItem('users', JSON.stringify(users));
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const user = users.find(u => u.username === username && u.password === password);
        if (!user) {
            document.getElementById('loginError').innerText = 'Hatalı kullanıcı adı veya şifre.';
            return;
        }

        // Çoklu oturum kontrolü (admin hariç)
        if (user.role !== 'admin') {
            const existingToken = localStorage.getItem('activeSessionToken');
            if (existingToken) {
                let logs = JSON.parse(localStorage.getItem('trainingLogs') || '[]');
                const idx = logs.findIndex(l => l.sessionId === existingToken && !l.logoutTime);
                if (idx !== -1) {
                    logs[idx].logoutTime = new Date().toISOString();
                    localStorage.setItem('trainingLogs', JSON.stringify(logs));
                }
                localStorage.removeItem('activeSessionToken');
                localStorage.removeItem('activeUserId');
                localStorage.removeItem('activeUserRole');
                localStorage.removeItem('sessionStartTime');
            }
        }

        const sessionToken = Date.now() + '_' + Math.random().toString(36).substring(2, 18) + '_' + user.id;
        localStorage.setItem('activeSessionToken', sessionToken);
        localStorage.setItem('activeUserId', user.id);
        localStorage.setItem('activeUsername', user.username);
        localStorage.setItem('activeCompany', user.company || '');
        localStorage.setItem('activeDangerClass', user.dangerClass || '');
        localStorage.setItem('activeUserRole', user.role);
        
        // Oturum başlangıç zamanını kaydet (kronometre için)
        const now = new Date().toISOString();
        localStorage.setItem('sessionStartTime', now);

        if (user.role !== 'admin') {
            let logs = JSON.parse(localStorage.getItem('trainingLogs') || '[]');
            logs.push({
                userId: user.id,
                username: user.username,
                company: user.company || '',
                dangerClass: user.dangerClass || '',
                sessionId: sessionToken,
                loginTime: now,
                logoutTime: null,
                totalElapsedSeconds: 0
            });
            localStorage.setItem('trainingLogs', JSON.stringify(logs));
        }

        if (user.role === 'admin') {
            window.location.href = 'admin.html';
        } else {
            window.location.href = 'user_dashboard.html';
        }
    });
</script>
</body>
</html>
