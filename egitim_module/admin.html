<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Paneli - 3S OSGB</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</head>
<body>
<div class="container">
    <div class="logo-area">
        <img src="3S OSGB.jpg" alt="Logo" class="logo">
        <h1>3S OSGB Admin Paneli</h1>
    </div>
    <div class="admin-actions">
        <h3>➕ Yeni Kullanıcı Ekle</h3>
        <input type="text" id="newUsername" placeholder="Kullanıcı Adı" required>
        <input type="text" id="newPassword" placeholder="Şifre" required>
        <input type="text" id="newCompany" placeholder="Firma Adı" required>
        <select id="newDangerClass" required>
            <option value="">Tehlike Sınıfı Seçin</option>
            <option value="az_tehlikeli">Az Tehlikeli</option>
            <option value="tehlikeli">Tehlikeli</option>
            <option value="cok_tehlikeli">Çok Tehlikeli</option>
        </select>
        <select id="newRole">
            <option value="user">Çalışan</option>
            <option value="admin">Admin</option>
        </select>
        <button id="addUserBtn">Kullanıcı Ekle</button>
    </div>
    <hr>
    <h3>📋 Mevcut Kullanıcılar</h3>
    <table id="userTable">
        <thead><tr><th>ID</th><th>KULLANICI ADI</th><th>FİRMA</th><th>TEHLİKE SINIFI</th><th>ROL</th><th>İŞLEM</th></tr></thead>
        <tbody></tbody>
    </table>

    <h3>📊 Eğitim Raporları (Tüm Oturumlar)</h3>
    <div class="filter-area">
        <input type="text" id="filterUsername" placeholder="Kullanıcı adı">
        <input type="text" id="filterCompany" placeholder="Firma adı">
        <button id="filterBtn">Filtrele</button>
        <button id="resetFilterBtn">Tümünü Göster</button>
        <button id="exportPdfBtn">📄 PDF Rapor Oluştur</button>
        <button id="exportExcelBtn">📊 Excel Rapor Oluştur</button>
    </div>
    <div style="overflow-x:auto;">
        <table id="reportTable">
            <thead>
                <tr><th>KULLANICI</th><th>FİRMA</th><th>TEHLİKE SINIFI</th><th>TAMAMLAMA ORANI (%)</th><th>TAMAMLANAN EĞİTİMLER (KOD)</th><th>SINAV DURUMU</th><th>OTURUM ID</th><th>GİRİŞ ZAMANI</th><th>ÇIKIŞ ZAMANI</th><th>SÜRE (dk)</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    <br><button id="logoutAdmin">Çıkış Yap</button>
</div>
<script>
    let allSessions = [];

    function replaceTurkishChars(str) {
        const map = { 'İ':'I','ı':'i','Ş':'S','ş':'s','Ğ':'G','ğ':'g','Ü':'U','ü':'u','Ö':'O','ö':'o','Ç':'C','ç':'c' };
        return str.replace(/[İıŞşĞğÜüÖöÇç]/g, (m) => map[m]||m);
    }

    async function getExamStatusSummary(userId, untilDate, modulesForUser) {
        const progress = await getProgress(userId);
        const categories = [...new Set(modulesForUser.map(m => m.category))];
        const statuses = [];
        for (let cat of categories) {
            const exam = progress[`exam_${cat}`];
            const passed = exam && exam.passed;
            const hasExam = categoryExams[cat] && categoryExams[cat].questions && categoryExams[cat].questions.length > 0;
            if (!hasExam) continue;
            const examText = passed ? '✅ Başarılı' : '❌ Başarısız (veya girilmemiş)';
            statuses.push(`${cat}: ${examText}`);
        }
        return statuses.join(' | ');
    }

    async function refreshUserTable() {
        const users = await getUsers();
        const tbody = document.querySelector('#userTable tbody');
        tbody.innerHTML = '';
        users.forEach(user => {
            const row = tbody.insertRow();
            row.insertCell(0).innerText = user.id;
            row.insertCell(1).innerText = user.username;
            row.insertCell(2).innerText = user.company || '-';
            row.insertCell(3).innerText = user.dangerClass === 'az_tehlikeli' ? 'Az Tehlikeli' : (user.dangerClass === 'tehlikeli' ? 'Tehlikeli' : (user.dangerClass === 'cok_tehlikeli' ? 'Çok Tehlikeli' : '-'));
            row.insertCell(4).innerText = user.role;
            const delBtn = document.createElement('button');
            delBtn.innerText = 'Sil';
            delBtn.onclick = async () => {
                if(confirm(`${user.username} silinsin mi?`)) {
                    await deleteUser(user.id);
                    refreshUserTable();
                    buildSessionData();
                    applyFilter();
                }
            };
            row.insertCell(5).appendChild(delBtn);
        });
    }

    async function buildSessionData() {
        const users = await getUsers();
        const logs = await getLogs();
        const filteredLogs = logs.filter(log => {
            const user = users.find(u => u.id == log.userId);
            return user && user.role !== 'admin';
        });
        allSessions = [];
        for (let log of filteredLogs) {
            const user = users.find(u => u.id == log.userId);
            const username = user ? user.username : 'Silinmiş';
            const company = user ? (user.company || '-') : '-';
            const dangerClass = user ? (user.dangerClass === 'az_tehlikeli' ? 'Az Tehlikeli' : (user.dangerClass === 'tehlikeli' ? 'Tehlikeli' : (user.dangerClass === 'cok_tehlikeli' ? 'Çok Tehlikeli' : '-'))) : '-';
            const modulesForUser = getModulesForDangerClass(user ? user.dangerClass : '');
            const untilDate = log.logoutTime ? log.logoutTime : new Date().toISOString();
            const totalDuration = modulesForUser.reduce((sum, m) => sum + m.duration, 0);
            const watchedSeconds = await getUserWatchedDurationForModulesUntil(log.userId, untilDate, modulesForUser);
            const overallPercent = totalDuration > 0 ? ((watchedSeconds / totalDuration) * 100).toFixed(1) : 0;
            const completedCodes = (await getCompletedModulesCodesForUserUntil(log.userId, untilDate, modulesForUser)).join(', ');
            const examSummary = await getExamStatusSummary(log.userId, untilDate, modulesForUser);
            let durationMinutes = '';
            if (log.logoutTime) {
                const diff = (new Date(log.logoutTime) - new Date(log.loginTime)) / 60000;
                durationMinutes = diff.toFixed(1);
            } else {
                const diff = (new Date() - new Date(log.loginTime)) / 60000;
                durationMinutes = diff.toFixed(1) + ' (devam ediyor)';
            }
            allSessions.push({
                sessionId: log.sessionId,
                username, company, dangerClass,
                overallPercent, completedCodes, examSummary,
                loginTime: log.loginTime,
                logoutTime: log.logoutTime,
                durationMinutes
            });
        }
        allSessions.sort((a, b) => new Date(b.loginTime) - new Date(a.loginTime));
    }

    function renderReportTable(data) {
        const tbody = document.querySelector('#reportTable tbody');
        tbody.innerHTML = '';
        data.forEach(s => {
            const row = tbody.insertRow();
            row.insertCell(0).innerText = s.username;
            row.insertCell(1).innerText = s.company;
            row.insertCell(2).innerText = s.dangerClass;
            row.insertCell(3).innerText = s.overallPercent;
            row.insertCell(4).innerText = s.completedCodes || '-';
            row.insertCell(5).innerText = s.examSummary || '-';
            row.insertCell(6).innerText = s.sessionId;
            row.insertCell(7).innerText = new Date(s.loginTime).toLocaleString();
            row.insertCell(8).innerText = s.logoutTime ? new Date(s.logoutTime).toLocaleString() : '-';
            row.insertCell(9).innerText = s.durationMinutes;
        });
    }

    function applyFilter() {
        const filterUser = document.getElementById('filterUsername').value.trim().toLowerCase();
        const filterComp = document.getElementById('filterCompany').value.trim().toLowerCase();
        const filtered = allSessions.filter(s =>
            (filterUser === '' || s.username.toLowerCase().includes(filterUser)) &&
            (filterComp === '' || s.company.toLowerCase().includes(filterComp))
        );
        renderReportTable(filtered);
        window.currentFilteredData = filtered;
    }

    function exportToExcel() {
        const data = window.currentFilteredData || [];
        if (data.length === 0) { alert('Raporlanacak veri yok.'); return; }
        const sheetData = [['KULLANICI','FİRMA','TEHLİKE SINIFI','TAMAMLAMA ORANI (%)','TAMAMLANAN EĞİTİMLER (KOD)','SINAV DURUMU','OTURUM ID','GİRİŞ ZAMANI','ÇIKIŞ ZAMANI','SÜRE (dk)']];
        data.forEach(s => {
            sheetData.push([s.username, s.company, s.dangerClass, s.overallPercent, s.completedCodes, s.examSummary, s.sessionId, new Date(s.loginTime).toLocaleString(), s.logoutTime ? new Date(s.logoutTime).toLocaleString() : '-', s.durationMinutes]);
        });
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Egitim Raporu');
        XLSX.writeFile(wb, `3S_OSGB_Rapor_${new Date().toISOString().slice(0,19)}.xlsx`);
    }

    function exportToPdf() {
        const data = window.currentFilteredData || [];
        if (data.length === 0) { alert('Raporlanacak veri yok.'); return; }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('landscape');
        doc.text('3S OSGB - Egitim Raporu (Tum Oturumlar)', 14, 15);
        doc.text(`Olusturma: ${new Date().toLocaleString()}`, 14, 22);
        const headers = [["KULLANICI","FIRMA","TEHLIKE SINIFI","TAMAMLAMA %","TAMAMLANAN KODLAR","SINAV DURUMU","OTURUM ID","GIRIS","CIKIS","SURE (dk)"]];
        const rows = data.map(s => [
            replaceTurkishChars(s.username), replaceTurkishChars(s.company), replaceTurkishChars(s.dangerClass),
            s.overallPercent, replaceTurkishChars(s.completedCodes), replaceTurkishChars(s.examSummary), s.sessionId,
            replaceTurkishChars(new Date(s.loginTime).toLocaleString()),
            s.logoutTime ? replaceTurkishChars(new Date(s.logoutTime).toLocaleString()) : '-',
            s.durationMinutes
        ]);
        doc.autoTable({ head: headers, body: rows, startY: 30, styles: { fontSize: 8 }, headStyles: { fillColor: [41,128,185] } });
        doc.save('3S_OSGB_rapor_tum_oturumlar.pdf');
    }

    document.getElementById('addUserBtn').addEventListener('click', async () => {
        const username = document.getElementById('newUsername').value.trim();
        const password = document.getElementById('newPassword').value.trim();
        const company = document.getElementById('newCompany').value.trim();
        const dangerClass = document.getElementById('newDangerClass').value;
        const role = document.getElementById('newRole').value;
        if (!username || !password || !company || !dangerClass) { alert('Tüm alanları doldurun'); return; }
        const result = await addUser({ username, password, company, dangerClass, role });
        if (result.success) {
            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('newCompany').value = '';
            document.getElementById('newDangerClass').value = '';
            refreshUserTable();
            buildSessionData();
            applyFilter();
        } else {
            alert(result.error);
        }
    });

    document.getElementById('filterBtn').addEventListener('click', applyFilter);
    document.getElementById('resetFilterBtn').addEventListener('click', () => {
        document.getElementById('filterUsername').value = '';
        document.getElementById('filterCompany').value = '';
        applyFilter();
    });
    document.getElementById('exportPdfBtn').addEventListener('click', exportToPdf);
    document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);
    document.getElementById('logoutAdmin').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'index.html';
    });

    window.addEventListener('beforeunload', () => {
        localStorage.clear();
    });

    refreshUserTable();
    buildSessionData().then(() => applyFilter());
</script>
</body>
</html>
